<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="cascara" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#FFB45E"/>
      <stop offset=".55" stop-color="#F2711C"/>
      <stop offset="1" stop-color="#A63D0A"/>
    </radialGradient>
    <radialGradient id="luz" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#FFF6C9"/>
      <stop offset=".45" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </radialGradient>
    <filter id="resplandor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .cara { animation: vela 3.4s infinite; }
      @keyframes vela { 0%, 100% { opacity: 1; } 38% { opacity: .78; } 44% { opacity: .96; } 70% { opacity: .72; } 76% { opacity: 1; } }
    }
  </style>
  <!-- Tallo y hoja -->
  <path d="M60 32c-1-9 2-17 10-22" stroke="#4E7A32" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M68 17c6-5 14-5 19-1-7 1-12 3-16 8z" fill="#7DB04F"/>
  <!-- Gajos -->
  <ellipse cx="37" cy="73" rx="27" ry="37" fill="url(#cascara)"/>
  <ellipse cx="83" cy="73" rx="27" ry="37" fill="url(#cascara)"/>
  <ellipse cx="60" cy="72" rx="26" ry="40" fill="url(#cascara)"/>
  <path d="M46 36c-7 10-9 24-7 37M74 36c7 10 9 24 7 37" stroke="#A63D0A" stroke-opacity=".45" stroke-width="2" fill="none"/>
  <!-- Cara iluminada por dentro -->
  <g class="cara" fill="url(#luz)" filter="url(#resplandor)">
    <path d="M35 64l11-14 11 14z"/><path d="M63 64l11-14 11 14z"/>
    <path d="M56 74l4-6 4 6z"/>
    <path d="M32 80c9 15 47 15 56 0-6 3-11 4-15 4l-3 6-5-6h-6l-5 6-3-6c-4 0-11-1-19-4z"/>
  </g>
</svg>
